      "bl": "블", "cl": "클", "fl": "플", "gl": "글", "pl": "플", "sl": "슬",

    // 모바일 브라우저 오디오 강제 활성화 함수 (사용자 터치 직후 실행)
    const unlockMobileAudio = () => {
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const silentUtter = new SpeechSynthesisUtterance(" ");
        silentUtter.volume = 0.01;
        window.speechSynthesis.speak(silentUtter);
      } catch (e) {
        console.log("Audio unlock:", e);
      }
    };

    const speakText = (text, rate = 0.85) => {
      if (!('speechSynthesis' in window)) return;
      
      // 모바일 오디오 깨우기
      unlockMobileAudio();

      setTimeout(() => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        
        // 영어 발음 설정 (기본값 우선 적용하여 모바일에서 무반응 방지)
        utterance.lang = 'en-US';
        utterance.rate = rate;
        utterance.pitch = 1.05;

        // 사용 가능한 음성 중 영어 음성 자동 탐색
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en'));
        if (enVoice) {
          utterance.voice = enVoice;
        }

        window.speechSynthesis.speak(utterance);
      }, 50);
    };

    const speakSequence = (items) => {
      if (!('speechSynthesis' in window)) return;
      unlockMobileAudio();

      setTimeout(() => {
        window.speechSynthesis.cancel();
        
        // 순차적으로 단어 읽기
        items.forEach((item, index) => {
          setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.lang = 'en-US';
            utterance.rate = item.rate || 0.85;
            
            const voices = window.speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en'));
            if (enVoice) utterance.voice = enVoice;

            window.speechSynthesis.speak(utterance);
          }, index * 700);
        });
      }, 50);
    };

    const triggerConfetti = () => {
      if (window.confetti) {
        window.confetti({ particleCount: 50, spread: 70, origin: { y: 0.65 } });
      }
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-phonics-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    function App() {
      const [user, setUser] = React.useState(null);
      const [inputNameVal, setInputNameVal] = React.useState("");
      const [studentName, setStudentName] = React.useState("");
      const [grade, setGrade] = React.useState("유치부");
      const [totalScore, setTotalScore] = React.useState(0);
      const [isSynced, setIsSynced] = React.useState(false);
      
      const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzGrP66w3iajVzebdvDWNTefAsJi5edrdEdDx3QeYSaGRIr55t5yiTXJV23YdBZzTP-/exec";
      
      const [sheetWebhookUrl, setSheetWebhookUrl] = React.useState(() => {
        return localStorage.getItem('phnics_sheet_webhook') || DEFAULT_WEBHOOK_URL;
      });
      const [showSettings, setShowSettings] = React.useState(false);
      const [syncStatusMsg, setSyncStatusMsg] = React.useState("");

      const [activeUnitId, setActiveUnitId] = React.useState(1);
      const [activeMode, setActiveMode] = React.useState('listen');

      const currentUnit = UNITS_DATA.find(u => u.id === activeUnitId) || UNITS_DATA[0];

      React.useEffect(() => {
        const handleFirebaseReady = async () => {
          if (!window.firebaseLoaded || !firebaseConfig) return;
          try {
            const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, getDoc } = window.firebaseModules;
            const app = window.firebaseModules.initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, async (u) => {
              if (u) {
                setUser(u);
                const userDocRef = doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data');
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) {
                  const data = docSnap.data();
                  if (data.studentName) {
                    setStudentName(data.studentName);
                    setInputNameVal(data.studentName);
                  }
                  if (data.grade) setGrade(data.grade);
                  if (typeof data.totalScore === 'number') setTotalScore(data.totalScore);
                  setIsSynced(true);
                }
              }
            });
          } catch (err) {
            console.error("Firebase init note:", err);
          }
        };

        if (window.firebaseLoaded) {
          handleFirebaseReady();
        } else {
          window.addEventListener('firebase-ready', handleFirebaseReady);
          return () => window.removeEventListener('firebase-ready', handleFirebaseReady);
        }
      }, []);

      const sendDataToGoogleSheet = async (currentScore, activityName = "General") => {
        const activeUrl = sheetWebhookUrl.trim() || DEFAULT_WEBHOOK_URL;
        if (!activeUrl) return;
        try {
          const payload = {
            studentName: studentName,
            grade: grade,
            score: currentScore,
            activity: activityName,
            timestamp: new Date().toLocaleString()
          };
          
          await fetch(activeUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncStatusMsg("📊 구글시트 전송 완료!");
          setTimeout(() => setSyncStatusMsg(""), 3000);
        } catch (e) {
          console.error("Sheet sync error:", e);
        }
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const trimmedName = inputNameVal.trim();
        if (!trimmedName) return;

        // 핸드폰 터치 및 소리 즉시 강제 활성화
        unlockMobileAudio();
        speakText(`Welcome, ${trimmedName}! Let's study!`);

        setStudentName(trimmedName);

        if (window.firebaseLoaded && firebaseConfig) {
          try {
            const { getAuth, getFirestore, doc, setDoc } = window.firebaseModules;
            const auth = getAuth();
            const db = getFirestore();
            if (auth.currentUser) {
              const userDocRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'profile', 'data');
              setDoc(userDocRef, {
                studentName: trimmedName,
                grade,
                totalScore,
                updatedAt: new Date().toISOString()
              }, { merge: true });
              setIsSynced(true);
            }
          } catch (err) {
            console.error("Sync error:", err);
          }
        }

        sendDataToGoogleSheet(totalScore, "Login/Start");
      };

      const handleScoreGain = async (points, activityName = "Activity") => {
        const updatedScore = totalScore + points;
        setTotalScore(updatedScore);

        if (window.firebaseLoaded && firebaseConfig) {
          try {
            const { getAuth, getFirestore, doc, setDoc } = window.firebaseModules;
            const auth = getAuth();
            const db = getFirestore();
            if (auth.currentUser && studentName) {
              const userDocRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'profile', 'data');
              await setDoc(userDocRef, {
                studentName,
                grade,
                totalScore: updatedScore,
                updatedAt: new Date().toISOString()
              }, { merge: true });
            }
          } catch (err) {
            console.error("Failed to sync score:", err);
          }
        }

        sendDataToGoogleSheet(updatedScore, activityName);
      };

      const saveWebhookUrl = (e) => {
        e.preventDefault();
        localStorage.setItem('phnics_sheet_webhook', sheetWebhookUrl.trim());
        setShowSettings(false);
        setSyncStatusMsg("✅ 구글시트 연동 주소 저장됨!");
        setTimeout(() => setSyncStatusMsg(""), 3000);
      };

      if (!studentName) {
        return (
          <div className="max-w-md mx-auto px-4 pt-8 text-center">
            <div className="bg-white rounded-3xl p-6 sm:p-8 border-4 border-pink-300 bubbly-card">
              <div className="text-7xl mb-3 bounce-gentle">🎈</div>
              <h1 className="text-2xl font-black text-pink-500 mb-1">파닉스 키즈 플레이랜드</h1>
              <p className="text-xs font-extrabold text-slate-400 mb-2">핸드폰 소리 최적화 버전</p>
              
              <div className="flex justify-center gap-2 mb-4">
                <div className="inline-block bg-emerald-100 text-emerald-700 font-bold text-[11px] px-3 py-1 rounded-full">
                  ✨ 구글시트 자동 연동됨
                </div>
                <button
                  type="button"
                  onClick={() => setShowSettings(!showSettings)}
                  className="bg-purple-100 text-purple-700 font-bold text-[11px] px-3 py-1 rounded-full hover:bg-purple-200"
                >
                  ⚙️ 설정 보기
                </button>
              </div>

              {showSettings && (
                <form onSubmit={saveWebhookUrl} className="mb-6 bg-purple-50 p-4 rounded-2xl border-2 border-purple-200 text-left">
                  <label className="text-[11px] font-bold text-purple-700 block mb-1">
                    Google Apps Script 웹앱 URL:
                  </label>
                  <input
                    type="url"
                    value={sheetWebhookUrl}
                    onChange={(e) => setSheetWebhookUrl(e.target.value)}
                    className="w-full p-2.5 text-xs rounded-xl border border-purple-300 bg-white font-mono mb-2 outline-none"
                  />
                  <button
                    type="submit"
                    className="w-full bg-purple-600 text-white font-bold py-2 rounded-xl text-xs"
                  >
                    확인
                  </button>
                </form>
              )}

              <form onSubmit={handleLoginSubmit} className="space-y-4 text-left">
                <div>
                  <label className="text-xs font-bold text-slate-500 ml-1">학년 선택</label>
                  <select
                    value={grade}
                    onChange={(e) => setGrade(e.target.value)}
                    className="w-full mt-1 p-3.5 rounded-2xl border-2 border-pink-200 bg-pink-50/50 font-bold text-slate-700 outline-none focus:border-pink-400"
                  >
                    <option value="유치부">유치부 🧸</option>
                    <option value="초등 1학년">초등 1학년 🎒</option>
                    <option value="초등 2학년">초등 2학년 ✏️</option>
                    <option value="초등 3학년 이상">초등 3학년 이상 🚀</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs font-bold text-slate-500 ml-1">어린이 이름</label>
                  <input
                    type="text"
                    required
                    placeholder="예: 김민준"
                    value={inputNameVal}
                    onChange={(e) => setInputNameVal(e.target.value)}
                    className="w-full mt-1 p-3.5 rounded-2xl border-2 border-pink-200 bg-pink-50/50 font-bold text-slate-700 outline-none focus:border-pink-400"
                  />
                  <div className="text-[11px] text-pink-600 mt-1.5 ml-1 font-bold">
                    💡 아래 버튼을 누르면 핸드폰 소리가 켜집니다!
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-pink-400 to-rose-500 text-white font-extrabold text-lg py-4 rounded-2xl bubbly-btn mt-2 hover:opacity-95 shadow-md flex items-center justify-center gap-2"
                >
                  <span>🔊 소리 켜고 모험 시작하기!</span>
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-md mx-auto px-3 pt-3">
          <header className="bg-white rounded-2xl p-3 mb-3 border-2 border-pink-200 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-2">
              <div className="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-xl">🎈</div>
              <div>
                <div className="text-[11px] font-bold text-pink-500 flex items-center gap-1">
                  <span>{grade}</span>
                  <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">🟢 자동연동</span>
                </div>
                <div className="text-base font-black text-slate-800 leading-none">{studentName}</div>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <div className="bg-amber-100 border border-amber-300 rounded-xl px-2.5 py-1 flex items-center gap-1 shadow-xs">
                <span className="text-base">⭐</span>
                <span className="font-black text-amber-700 text-sm">{totalScore}점</span>
              </div>
              <button
                type="button"
                onClick={() => setStudentName("")}
                className="p-2 rounded-xl bg-slate-100 text-slate-500 hover:bg-slate-200 text-xs font-bold"
                title="로그아웃/이름변경"
              >
                👤
              </button>
            </div>
          </header>

          {syncStatusMsg && (
            <div className="bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-xl mb-3 text-center shadow-sm animate-pulse">
              {syncStatusMsg}
            </div>
          )}

          <div className="grid grid-cols-4 gap-1.5 mb-3">
            {UNITS_DATA.map(u => {
              const isActive = u.id === activeUnitId;
              return (
                <button
                  key={u.id}
                  type="button"
                  onClick={() => {
                    unlockMobileAudio();
                    setActiveUnitId(u.id);
                    speakText(u.title);
                  }}
                  className={`py-2 px-1 rounded-2xl font-black text-xs border-2 text-center transition-all ${
                    isActive
                      ? 'bg-pink-500 border-pink-600 text-white shadow-sm scale-102'
                      : 'bg-white border-pink-100 text-slate-600 hover:bg-pink-50'
                  }`}
                >
                  <div className="text-sm">{u.mascot}</div>
                  <div>U{u.id}</div>
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-5 gap-1 mb-3 bg-white p-1.5 rounded-2xl border-2 border-pink-100 shadow-xs">
            <ModeTab id="listen" label="듣기" icon="🎧" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="blend" label="조합" icon="🧩" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="match" label="짝맞추기" icon="🃏" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="spelling" label="스펠링" icon="✏️" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="missing" label="빈칸" icon="🔍" active={activeMode} setMode={setActiveMode} />
          </div>

          <main className="bg-white rounded-3xl p-4 border-2 border-pink-200 bubbly-card min-h-[440px]">
            {activeMode === 'listen' && <ListenRepeatMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '듣기 학습')} />}
            {activeMode === 'blend' && <BlendMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '단어 조합')} />}
            {activeMode === 'match' && <CardMatchMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '짝맞추기 게임')} />}
            {activeMode === 'spelling' && <SpellingQuizMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '스펠링 퀴즈')} />}
            {activeMode === 'missing' && <MissingLetterMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '빈칸 채우기')} />}
          </main>
        </div>
      );
    }

    function ModeTab({ id, label, icon, active, setMode }) {
      const isSelected = active === id;
      return (
        <button
          type="button"
          onClick={() => {
            unlockMobileAudio();
            setMode(id);
          }}
          className={`py-2 rounded-xl font-extrabold text-[11px] flex flex-col items-center gap-0.5 transition-all ${
            isSelected
              ? 'bg-gradient-to-b from-pink-400 to-rose-400 text-white shadow-xs'
              : 'text-slate-500 hover:bg-pink-50'
          }`}
        >
          <span className="text-base">{icon}</span>
          <span>{label}</span>
        </button>
      );
    }

    function ListenRepeatMode({ unit, onScore }) {
      const [selectedWord, setSelectedWord] = React.useState(unit.words[0]);

      React.useEffect(() => {
        setSelectedWord(unit.words[0]);
      }, [unit]);

      return (
        <div className="text-center">
          <div className="text-xs font-extrabold text-pink-500 mb-2">{unit.title} • 교재 단어 듣고 따라하기!</div>

          <div
            onClick={() => {
              unlockMobileAudio();
              speakText(selectedWord.word);
              onScore(1);
            }}
            className="bg-gradient-to-b from-amber-50 to-pink-50 rounded-2xl p-5 border-2 border-pink-200 mb-4 cursor-pointer bubbly-btn active:scale-98"
          >
            <div className="text-6xl my-2 bounce-gentle">{selectedWord.emoji}</div>
            <div className="text-3xl font-black text-slate-800 tracking-wide">
              {selectedWord.word}
            </div>
            <div className="text-sm font-bold text-slate-400 mt-1">"{selectedWord.kor}"</div>
            <div className="inline-flex items-center gap-1 bg-pink-400 text-white text-xs font-extrabold px-3 py-1 rounded-full mt-3 shadow-xs">
              🔊 원어민 소리 듣기 (+1점)
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 max-h-[220px] overflow-y-auto pr-1">
            {unit.words.map(w => {
              const isSelected = selectedWord?.id === w.id;
              return (
                <button
                  key={w.id}
                  type="button"
                  onClick={() => {
                    unlockMobileAudio();
                    setSelectedWord(w);
                    speakText(w.word);
                    onScore(1);
                  }}
                  className={`p-2.5 rounded-2xl border-2 text-center transition-all ${
                    isSelected
                      ? 'bg-amber-100 border-amber-400 scale-102 shadow-xs'
                      : 'bg-white border-slate-100 hover:border-pink-200'
                  }`}
                >
                  <div className="text-2xl mb-1">{w.emoji}</div>
                  <div className="font-extrabold text-xs text-slate-700 truncate">{w.word}</div>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function BlendMode({ unit, onScore }) {
      const [selectedTarget, setSelectedTarget] = React.useState('ALL');

      React.useEffect(() => {
        setSelectedTarget('ALL');
      }, [unit]);

      const filteredWords = selectedTarget === 'ALL'
        ? unit.words
        : unit.words.filter(w => w.blend === selectedTarget);

      const handleCombine = (w) => {
        unlockMobileAudio();
        speakSequence([
          { text: w.blend, rate: 0.8 },
          { text: w.word, rate: 0.85 }
        ]);
        triggerConfetti();
        onScore(5);
      };

      return (
        <div>
          <div className="text-xs font-bold text-center text-purple-600 mb-2">
            교재 단어 조합 연습하기 (+5점)
          </div>

          <div className="flex flex-wrap gap-1 mb-3 justify-center">
            <button
              type="button"
              onClick={() => {
                unlockMobileAudio();
                setSelectedTarget('ALL');
              }}
              className={`px-3 py-1 rounded-full text-xs font-bold ${
                selectedTarget === 'ALL' ? 'bg-purple-600 text-white' : 'bg-purple-100 text-purple-700'
              }`}
            >
              전체
            </button>
            {unit.targets.map(t => (
              <button
                key={t}
                type="button"
                onClick={() => {
                  unlockMobileAudio();
                  setSelectedTarget(t);
                }}
                className={`px-3 py-1 rounded-full text-xs font-bold ${
                  selectedTarget === t ? 'bg-purple-600 text-white' : 'bg-purple-100 text-purple-700'
                }`}
              >
                {t}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-2 gap-2 max-h-[300px] overflow-y-auto pr-1">
            {filteredWords.map(w => (
              <div
                key={w.id}
                onClick={() => handleCombine(w)}
                className="bg-purple-50/70 border-2 border-purple-200 rounded-2xl p-3 text-center cursor-pointer hover:bg-purple-100 bubbly-btn"
              >
                <div className="text-3xl mb-1">{w.emoji}</div>
                <div className="text-base font-black text-purple-800">
                  <span className="text-pink-600 underline">{w.blend}</span>
                  <span>{w.word.replace(w.blend, '')}</span>
                </div>
                <div className="text-[11px] text-slate-500 font-bold">{w.kor}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CardMatchMode({ unit, onScore }) {
      const [cards, setCards] = React.useState([]);
      const [flipped, setFlipped] = React.useState([]);
      const [matched, setMatched] = React.useState([]);
      const [isComplete, setIsComplete] = React.useState(false);

      const initGame = React.useCallback(() => {
        const shuffledWords = [...unit.words].sort(() => 0.5 - Math.random()).slice(0, 4);
        const deck = [];
        shuffledWords.forEach(w => {
          deck.push({ id: w.id + '_word', type: 'word', content: w.word, matchId: w.id });
          deck.push({ id: w.id + '_emoji', type: 'emoji', content: w.emoji, matchId: w.id });
        });
        setCards(deck.sort(() => 0.5 - Math.random()));
        setFlipped([]);
        setMatched([]);
        setIsComplete(false);
      }, [unit]);

      React.useEffect(() => {
        initGame();
      }, [unit, initGame]);

      const handleCardClick = (card) => {
        unlockMobileAudio();
        if (flipped.length === 2 || flipped.includes(card.id) || matched.includes(card.matchId)) return;

        const newFlipped = [...flipped, card.id];
        setFlipped(newFlipped);

        if (card.type === 'word') {
          speakText(card.content);
        }

        if (newFlipped.length === 2) {
          const firstCard = cards.find(c => c.id === newFlipped[0]);
          const secondCard = cards.find(c => c.id === newFlipped[1]);

          if (firstCard.matchId === secondCard.matchId) {
            const newMatched = [...matched, firstCard.matchId];
            setMatched(newMatched);
            setFlipped([]);
            triggerConfetti();
            onScore(10);

            if (newMatched.length === cards.length / 2) {
              setIsComplete(true);
              speakText("Great job!");
            }
          } else {
            setTimeout(() => {
              setFlipped([]);
            }, 800);
          }
        }
      };

      return (
        <div className="text-center">
          <div className="text-xs font-bold text-pink-500 mb-2">단어와 그림 짝맞추기 게임 (+10점)</div>

          {isComplete ? (
            <div className="py-8 bg-pink-50 rounded-2xl border-2 border-pink-200 mb-4">
              <div className="text-5xl mb-2">🎉</div>
              <div className="text-xl font-black text-pink-600 mb-3">모든 짝을 맞췄어요!</div>
              <button
                type="button"
                onClick={() => {
                  unlockMobileAudio();
                  initGame();
                }}
                className="bg-pink-500 text-white font-bold px-6 py-2.5 rounded-xl bubbly-btn text-sm"
              >
                다시 하기 🔄
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-4 gap-2 mb-4">
              {cards.map(card => {
                const isFlipped = flipped.includes(card.id) || matched.includes(card.matchId);
                const isMatched = matched.includes(card.matchId);
                return (
                  <button
                    key={card.id}
                    type="button"
                    onClick={() => handleCardClick(card)}
                    className={`h-24 rounded-2xl border-2 text-2xl font-bold flex items-center justify-center transition-all ${
                      isMatched
                        ? 'bg-emerald-100 border-emerald-400 opacity-60'
                        : isFlipped
                        ? 'bg-white border-pink-400 shadow-md'
                        : 'bg-gradient-to-b from-pink-400 to-rose-400 border-pink-500 text-white'
                    }`}
                  >
                    {isFlipped ? card.content : '❓'}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function SpellingQuizMode({ unit, onScore }) {
      const [quizIndex, setQuizIndex] = React.useState(0);
      const [options, setOptions] = React.useState([]);
      const [selectedChoice, setSelectedChoice] = React.useState(null);
      const [isCorrect, setIsCorrect] = React.useState(false);

      const currentWord = unit.words[quizIndex % unit.words.length];

      const setupQuiz = React.useCallback(() => {
        const target = unit.words[quizIndex % unit.words.length];
        speakText(target.word);
        
        const wrongWords = unit.words.filter(w => w.id !== target.id);
        const shuffledWrong = [...wrongWords].sort(() => 0.5 - Math.random()).slice(0, 3);
        const choices = [...shuffledWrong, target].sort(() => 0.5 - Math.random());
        
        setOptions(choices);
        setSelectedChoice(null);
        setIsCorrect(false);
      }, [quizIndex, unit]);

      React.useEffect(() => {
        setupQuiz();
      }, [quizIndex, unit, setupQuiz]);

      const handleAnswer = (wordObj) => {
        unlockMobileAudio();
        setSelectedChoice(wordObj.id);
        if (wordObj.id === currentWord.id) {
          setIsCorrect(true);
          triggerConfetti();
          speakText("Correct!");
          onScore(10);
          setTimeout(() => {
            setQuizIndex(prev => prev + 1);
          }, 1200);
        } else {
          speakText("Try again!");
        }
      };

      return (
        <div className="text-center">
          <div className="text-xs font-bold text-pink-500 mb-2">알맞은 스펠링 고르기 퀴즈 (+10점)</div>

          <div className="bg-gradient-to-b from-amber-50 to-pink-50 rounded-2xl p-6 border-2 border-pink-200 mb-4">
            <div className="text-6xl mb-2 bounce-gentle">{currentWord.emoji}</div>
            <div className="text-sm font-bold text-slate-500 mb-1">뜻: "{currentWord.kor}"</div>
            <button
              type="button"
              onClick={() => {
                unlockMobileAudio();
                speakText(currentWord.word);
              }}
              className="bg-pink-500 text-white px-4 py-1.5 rounded-full font-bold text-xs shadow-xs"
            >
              🔊 소리 듣기
            </button>
          </div>

          <div className="grid grid-cols-2 gap-2">
            {options.map(opt => {
              let btnStyle = "bg-white border-pink-200 text-slate-700 hover:border-pink-400";
              if (selectedChoice === opt.id) {
                btnStyle = opt.id === currentWord.id
                  ? "bg-emerald-500 border-emerald-600 text-white"
                  : "bg-rose-500 border-rose-600 text-white";
              }
              return (
                <button
                  key={opt.id}
                  type="button"
                  onClick={() => handleAnswer(opt)}
                  className={`p-3 rounded-2xl border-2 font-black text-lg transition-all bubbly-btn ${btnStyle}`}
                >
                  {opt.word}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function MissingLetterMode({ unit, onScore }) {
      const [quizIndex, setQuizIndex] = React.useState(0);
      const [choices, setChoices] = React.useState([]);
      const [solved, setSolved] = React.useState(false);

      const currentWord = unit.words[quizIndex % unit.words.length];

      const setupQuiz = React.useCallback(() => {
        const target = unit.words[quizIndex % unit.words.length];
        speakText(target.word);

        const blendPart = target.blend;
        const otherBlends = unit.targets.filter(t => t !== blendPart);
        const shuffledWrong = [...otherBlends].sort(() => 0.5 - Math.random()).slice(0, 2);
        
        const cList = [...shuffledWrong, blendPart].sort(() => 0.5 - Math.random());
        setChoices(cList);
        setSolved(false);
      }, [quizIndex, unit]);

      React.useEffect(() => {
        setupQuiz();
      }, [quizIndex, unit, setupQuiz]);

      const handleChoice = (blendVal) => {
        unlockMobileAudio();
        if (blendVal === currentWord.blend) {
          setSolved(true);
          triggerConfetti();
          speakText(currentWord.word);
          onScore(15);
          setTimeout(() => {
            setQuizIndex(prev => prev + 1);
          }, 1500);
        } else {
          speakText("Try again.");
        }
      };

      const restPart = currentWord.word.replace(currentWord.blend, '');

      return (
        <div className="text-center">
          <div className="text-xs font-bold text-pink-500 mb-2">빈칸 블렌드 채우기 퀴즈 (+15점)</div>

          <div className="bg-gradient-to-b from-sky-50 to-pink-50 rounded-2xl p-6 border-2 border-pink-200 mb-4">
            <div className="text-6xl mb-2">{currentWord.emoji}</div>
            <div className="text-3xl font-black text-slate-800 tracking-wider my-3 flex items-center justify-center gap-1">
              <span className={`px-3 py-1 rounded-xl border-2 ${solved ? 'bg-emerald-200 border-emerald-400 text-emerald-800' : 'bg-white border-dashed border-pink-400 text-pink-500'}`}>
                {solved ? currentWord.blend : '___'}
              </span>
              <span>{restPart}</span>
            </div>
            <div className="text-xs text-slate-500 font-bold">뜻: "{currentWord.kor}"</div>
          </div>

          <div className="grid grid-cols-3 gap-2">
            {choices.map(c => (
              <button
                key={c}
                type="button"
                onClick={() => handleChoice(c)}
                className="bg-white border-2 border-purple-200 text-purple-700 font-black text-xl p-3 rounded-2xl bubbly-btn hover:border-purple-400"
              >
                {c}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
