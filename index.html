      user-select: none;

    .bubbly-btn {
      box-shadow: 0 6px 0px 0px rgba(0, 0, 0, 0.12);

    }
    .bubbly-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px 0px rgba(0, 0, 0, 0.12);
    }
    .bounce-gentle {
      animation: bounceGentle 2s infinite ease-in-out;

    const PHONICS_SOUND_MAP = {
      "bl": "블르", "cl": "클르", "fl": "플르", "gl": "글르", "pl": "플르", "sl": "슬르",
      "br": "브르", "cr": "크르", "fr": "프르", "dr": "드르", "gr": "그르", "tr": "트르",
      "sk": "스크", "sm": "스므", "sn": "스느", "st": "스트", "sw": "스워", "sp": "스프",
      "sh": "쉬",   "ch": "치",   "wh": "워",   "th": "쓰",   "ph": "프",   "ck": "크", "ng": "응",
      "nd": "은드", "nk": "응크", "nt": "은트"
    };

    let isAudioUnlocked = false;

    // 모바일 환경에서 사용자가 화면을 탭하는 순간 음성 엔진의 잠금을 풉니다.
    const unlockAudio = () => {
      if (isAudioUnlocked || !('speechSynthesis' in window)) return;
      
      // 모바일 사파리/크롬/카카오톡 등에서 강제로 오디오 권한을 얻기 위해 무음 재생
      const dummyUtterance = new SpeechSynthesisUtterance('');
      dummyUtterance.volume = 0; 
      dummyUtterance.rate = 1;
      
      window.speechSynthesis.cancel(); // 기존 대기열 초기화
      window.speechSynthesis.resume(); // 엔진 강제 기상
      window.speechSynthesis.speak(dummyUtterance);
      
      isAudioUnlocked = true;
      
      // 한 번 풀렸으면 리스너 제거
      document.removeEventListener('touchstart', unlockAudio, true);
      document.removeEventListener('click', unlockAudio, true);
    };

    // 화면 아무 곳이나 터치하면 무조건 잠금 해제 실행
    document.addEventListener('touchstart', unlockAudio, { once: true, capture: true });
    document.addEventListener('click', unlockAudio, { once: true, capture: true });

    const getVoice = (lang) => {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (lang === 'ko') return voices.find(v => v.lang.startsWith('ko')) || null;
      return voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en')) || voices[0];
    };

    // setTimeout 같은 딜레이를 모두 제거하여 터치 즉시 발사되도록 만든 함수
    const speakText = (text, rate = 0.85, useKoreanPhonics = false) => {
      if (!('speechSynthesis' in window)) return;
      
      // 즉각적인 재생을 위해 엔진을 깨우고 기존 음성을 바로 취소합니다 (모바일 필수)
      window.speechSynthesis.resume();
      window.speechSynthesis.cancel();

      const lowerText = text.toLowerCase().trim();
      const phoneticSound = PHONICS_SOUND_MAP[lowerText];

      const utterance = new SpeechSynthesisUtterance();

      if (phoneticSound && useKoreanPhonics) {
        utterance.text = phoneticSound;
        utterance.lang = 'ko-KR';
        const korVoice = getVoice('ko');
        if (korVoice) utterance.voice = korVoice;
        utterance.rate = 0.8;
        utterance.pitch = 1.15;
      } else {
        utterance.text = text;
        utterance.lang = 'en-US';
        const enVoice = getVoice('en');
        if (enVoice) utterance.voice = enVoice;
        utterance.rate = rate;
        utterance.pitch = 1.05;
      }

      // 지연 없이 바로 소리 출력
      window.speechSynthesis.speak(utterance);
    };

    // 선생님의 구글 시트 웹앱 URL 고정
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxnJs1X538aiBOauF35oVnfniGcSeHlhtGqG5bkbEC6OG6K2Rki4eET-gcikmqeVu71/exec";

    const sendScoreToSheet = (group, name, score, activityName) => {
      if (!name) return;
      
      const payload = {
        timestamp: new Date().toLocaleString(),
        group: group,
        name: name,
        score: Number(score), // 점수를 반드시 숫자로 전달
        activity: activityName
      };

      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors', // CORS 보안 에러 방지
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      }).catch(err => console.error("시트 전송 에러:", err));
    };

    const triggerConfetti = () => {
      if (window.confetti) window.confetti({ particleCount: 50, spread: 70, origin: { y: 0.65 } });
    };

    function App() {

      const [studentName, setStudentName] = React.useState("");
      const [grade, setGrade] = React.useState("유치부");
      const [totalScore, setTotalScore] = React.useState(0);
      
      const [activeUnitId, setActiveUnitId] = React.useState(1);
      const [activeMode, setActiveMode] = React.useState('listen');
      const [nameError, setNameError] = React.useState(false); // 이름 미입력 에러 표시용

      const currentUnit = UNITS_DATA.find(u => u.id === activeUnitId) || UNITS_DATA[0];

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const trimmedName = inputNameVal.trim();
        
        // 이름을 입력하지 않았거나 스페이스바만 친 경우 차단
        if (trimmedName.length === 0) {
          setNameError(true);
          return;
        }

        // 폼 제출 시 오디오 잠금을 확실하게 해제
        unlockAudio(); 

        setNameError(false);
        setStudentName(trimmedName);
        
        // 로그인 완료 즉시 0점 시트로 전송
        sendScoreToSheet(grade, trimmedName, 0, "Login/Start");
        speakText(`Welcome, ${trimmedName}!`);
      };

      const handleScoreGain = (points, activityName) => {
        const updatedScore = totalScore + points;
        setTotalScore(updatedScore);
        // 점수 획득 시 구글 시트로 업데이트 전송
        sendScoreToSheet(grade, studentName, updatedScore, activityName);
      };

      // 1. 로그인 화면 (불필요한 버튼들 모두 제거)
      if (!studentName) {
        return (
          <div className="max-w-md mx-auto px-4 pt-8 text-center" onTouchStart={unlockAudio} onClick={unlockAudio}>
            <div className="bg-white rounded-3xl p-6 sm:p-8 border-4 border-pink-300 bubbly-card">
              <div className="text-7xl mb-3 bounce-gentle">🎈</div>
              <h1 className="text-2xl font-black text-pink-500 mb-1">파닉스 키즈 플레이랜드</h1>
              <p className="text-xs font-extrabold text-slate-400 mb-6">부모님 핸드폰에서도 원어민 소리가 팡팡! 🔊</p>
              
              <form onSubmit={handleLoginSubmit} className="space-y-4 text-left">
                <div>
                  <label className="text-xs font-bold text-slate-500 ml-1">학년 선택</label>
                  <select
                    value={grade}
                    onChange={(e) => setGrade(e.target.value)}
                    className="w-full mt-1 p-3.5 rounded-2xl border-2 border-pink-200 bg-pink-50 font-bold text-slate-700 outline-none focus:border-pink-400"
                  >
                    <option value="유치부">유치부 🧸</option>
                    <option value="초등 1학년">초등 1학년 🎒</option>
                    <option value="초등 2학년">초등 2학년 ✏️</option>
                    <option value="초등 3학년 이상">초등 3학년 이상 🚀</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs font-bold text-slate-500 ml-1">어린이 이름</label>
                  <input
                    type="text"
                    placeholder="예: 김민준"
                    value={inputNameVal}
                    onChange={(e) => {
                      setInputNameVal(e.target.value);
                      setNameError(false);
                    }}
                    className={`w-full mt-1 p-3.5 rounded-2xl border-2 bg-pink-50 font-bold text-slate-700 outline-none transition-colors ${
                      nameError ? 'border-red-400 focus:border-red-500' : 'border-pink-200 focus:border-pink-400'
                    }`}
                  />
                  {nameError && (
                    <div className="text-xs text-red-500 font-bold mt-1.5 ml-1">
                      ⚠️ 이름을 꼭 입력해주세요!
                    </div>
                  )}
                </div>

                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-pink-400 to-rose-500 text-white font-extrabold text-lg py-4 rounded-2xl bubbly-btn mt-2 active:scale-95 transition-transform"
                >
                  🚀 모험 시작하기!
                </button>
              </form>
            </div>
          </div>
        );
      }

      // 2. 메인 학습 화면
      return (
        <div className="max-w-md mx-auto px-3 pt-3">
          <header className="bg-white rounded-2xl p-3 mb-3 border-2 border-pink-200 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-2">
              <div className="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-xl">🎈</div>
              <div>
                <div className="text-[11px] font-bold text-pink-500 flex items-center gap-1">
                  <span>{grade}</span>
                  <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">🟢 자동저장</span>
                </div>
                <div className="text-base font-black text-slate-800 leading-none">{studentName}</div>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <div className="bg-amber-100 border border-amber-300 rounded-xl px-3 py-1.5 flex items-center gap-1 shadow-sm">
                <span className="text-base">⭐</span>
                <span className="font-black text-amber-700 text-sm">{totalScore}점</span>
              </div>
              {/* 공유/설정 버튼 삭제, 로그아웃 버튼만 유지 */}
              <button
                type="button"
                onClick={() => { setStudentName(""); setTotalScore(0); }}
                className="p-2 rounded-xl bg-slate-100 text-slate-500 hover:bg-slate-200 text-xs font-bold"
                title="처음으로"
              >
                👤
              </button>
            </div>
          </header>

          <div className="grid grid-cols-4 gap-1.5 mb-3">
            {UNITS_DATA.map(u => {
              const isActive = u.id === activeUnitId;
              return (
                <button
                  key={u.id}
                  type="button"
                  onClick={() => {
                    setActiveUnitId(u.id);
                    speakText(u.title);
                  }}
                  className={`py-2 px-1 rounded-2xl font-black text-xs border-2 text-center transition-all ${
                    isActive ? 'bg-pink-500 border-pink-600 text-white shadow-sm scale-102' : 'bg-white border-pink-100 text-slate-600 hover:bg-pink-50'
                  }`}
                >
                  <div className="text-sm">{u.mascot}</div>
                  <div>U{u.id}</div>
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-5 gap-1 mb-3 bg-white p-1.5 rounded-2xl border-2 border-pink-100 shadow-sm">
            <ModeTab id="listen" label="듣기" icon="🎧" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="blend" label="조합" icon="🧩" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="match" label="짝맞추기" icon="🃏" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="spelling" label="스펠링" icon="✏️" active={activeMode} setMode={setActiveMode} />
            <ModeTab id="missing" label="빈칸" icon="🔍" active={activeMode} setMode={setActiveMode} />
          </div>

          <main className="bg-white rounded-3xl p-4 border-2 border-pink-200 bubbly-card min-h-[440px]">
            {activeMode === 'listen' && <ListenRepeatMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '듣기 학습')} />}
            {activeMode === 'blend' && <BlendMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '단어 조합')} />}
            {activeMode === 'match' && <CardMatchMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '짝맞추기 게임')} />}
            {activeMode === 'spelling' && <SpellingQuizMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '스펠링 퀴즈')} />}
            {activeMode === 'missing' && <MissingLetterMode unit={currentUnit} onScore={(pts) => handleScoreGain(pts, '빈칸 채우기')} />}
          </main>
        </div>
      );
    }

    function ModeTab({ id, label, icon, active, setMode }) {
      const isSelected = active === id;
      return (
        <button
          type="button"
          onClick={() => setMode(id)}
          className={`py-2 rounded-xl font-extrabold text-[11px] flex flex-col items-center gap-0.5 transition-all ${
            isSelected ? 'bg-gradient-to-b from-pink-400 to-rose-400 text-white shadow-sm' : 'text-slate-500 hover:bg-pink-50'
          }`}
        >
          <span className="text-base">{icon}</span>
          <span>{label}</span>
        </button>
      );
    }

    function ListenRepeatMode({ unit, onScore }) {
      const [selectedWord, setSelectedWord] = React.useState(unit.words[0]);
      React.useEffect(() => { setSelectedWord(unit.words[0]); }, [unit]);

      return (
        <div className="text-center">
          <div className="text-xs font-extrabold text-pink-500 mb-2">{unit.title} • 그림 카드를 누르고 소리를 들어보세요!</div>

          <div
            onClick={() => {
              speakText(selectedWord.word);
              onScore(1);
            }}
            className="bg-gradient-to-b from-amber-50 to-pink-50 rounded-2xl p-5 border-2 border-pink-200 mb-4 cursor-pointer bubbly-btn active:scale-95"
          >
            <div className="text-6xl my-2 bounce-gentle">{selectedWord.emoji}</div>
            <div className="text-3xl font-black text-slate-800 tracking-wide">{selectedWord.word}</div>
            <div className="text-sm font-bold text-slate-400 mt-1">"{selectedWord.kor}"</div>
            <div className="inline-flex items-center gap-1 bg-pink-400 text-white text-xs font-extrabold px-3 py-1 rounded-full mt-3 shadow-sm">
              🔊 원어민 소리 듣기 (+1점)
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 max-h-[260px] overflow-y-auto pr-1">
            {unit.words.map(w => {
              const isSelected = selectedWord?.id === w.id;
              return (
                <button
                  key={w.id}
                  type="button"
                  onClick={() => {
                    setSelectedWord(w);
                    speakText(w.word);
                    onScore(1);
                  }}
                  className={`p-2.5 rounded-2xl border-2 text-center transition-all ${
                    isSelected ? 'bg-amber-100 border-amber-400 scale-102 shadow-sm' : 'bg-white border-slate-100 hover:border-pink-200'
                  }`}
                >
                  <div className="text-2xl mb-1">{w.emoji}</div>
                  <div className="font-extrabold text-xs text-slate-700">{w.word}</div>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function BlendMode({ unit, onScore }) {
      const [selectedTarget, setSelectedTarget] = React.useState('ALL');
      React.useEffect(() => { setSelectedTarget('ALL'); }, [unit]);

      const filteredWords = selectedTarget === 'ALL' ? unit.words : unit.words.filter(w => w.blend === selectedTarget);

      const handleCombine = (w) => {
        speakText(w.word);
        triggerConfetti();
        onScore(5);
      };

      return (
        <div>
          <div className="text-xs font-bold text-center text-purple-600 mb-2">소리 조각을 누르고 단어를 조합해보세요! (+5점)</div>
          <div className="flex flex-wrap gap-1 justify-center mb-3">
            <button
              type="button"
              onClick={() => setSelectedTarget('ALL')}
              className={`px-2.5 py-1 rounded-xl font-black text-xs border-2 ${
                selectedTarget === 'ALL' ? 'bg-purple-600 border-purple-700 text-white' : 'bg-white border-purple-200 text-purple-600'
              }`}
            >
              전체 ({unit.words.length})
            </button>
            {unit.targets.map(t => (
              <button
                key={t}
                type="button"
                onClick={() => { setSelectedTarget(t); speakText(t, 0.85, true); }}
                className={`px-2.5 py-1 rounded-xl font-black text-xs border-2 ${
                  selectedTarget === t ? 'bg-purple-500 border-purple-600 text-white' : 'bg-white border-purple-200 text-purple-600'
                }`}
              >
                /{t}/
              </button>
            ))}
          </div>

          <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1 pb-4">
            {filteredWords.map(w => (
              <div
                key={w.id}
                onClick={() => handleCombine(w)}
                className="bg-purple-50/70 border-2 border-purple-200 p-2.5 rounded-2xl flex items-center justify-between cursor-pointer bubbly-btn hover:bg-purple-100 transition-all active:scale-95"
              >
                <div className="flex items-center gap-2.5">
                  <span className="text-3xl">{w.emoji}</span>
                  <div>
                    <div className="font-black text-base text-slate-800">
                      {w.isSuffix ? `${w.rest} + ${w.blend}` : `${w.blend} + ${w.rest}`}
                    </div>
                    <div className="text-[11px] font-bold text-slate-400">{w.kor}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-black text-purple-700 bg-purple-200/80 px-2.5 py-1 rounded-lg">{w.word}</span>
                  <span className="bg-yellow-400 text-yellow-950 font-extrabold px-2.5 py-1 rounded-xl text-xs shadow-sm">합치기 ⚡</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CardMatchMode({ unit, onScore }) {
      const [cards, setCards] = React.useState([]);
      const [flippedCards, setFlippedCards] = React.useState([]);
      const [matchedCardIds, setMatchedCardIds] = React.useState([]);
      const [isProcessing, setIsProcessing] = React.useState(false);

      const startNewGame = () => {
        const shuffledWords = [...unit.words].sort(() => 0.5 - Math.random()).slice(0, 4);
        const cardDeck = [];
        shuffledWords.forEach(w => {
          cardDeck.push({ id: `${w.id}_blend`, pairId: w.id, type: 'blend', content: w.blend, wordObj: w });
          cardDeck.push({ id: `${w.id}_word`, pairId: w.id, type: 'word', content: w.word, emoji: w.emoji, wordObj: w });
        });
        setCards(cardDeck.sort(() => 0.5 - Math.random()));
        setFlippedCards([]);
        setMatchedCardIds([]);
        setIsProcessing(false);
      };

      React.useEffect(() => { startNewGame(); }, [unit]);

      const handleCardClick = (card) => {
        if (isProcessing || flippedCards.some(c => c.id === card.id) || matchedCardIds.includes(card.pairId)) return;
        
        speakText(card.content, 0.85, card.type === 'blend'); 
        
        const newFlipped = [...flippedCards, card];
        setFlippedCards(newFlipped);

        if (newFlipped.length === 2) {
          setIsProcessing(true);
          if (newFlipped[0].pairId === newFlipped[1].pairId) {
            setTimeout(() => {
              setMatchedCardIds(prev => [...prev, newFlipped[0].pairId]);
              setFlippedCards([]);
              setIsProcessing(false);
              triggerConfetti();
              onScore(10);
            }, 600);
          } else {
            setTimeout(() => {
              setFlippedCards([]);
              setIsProcessing(false);
            }, 1000);
          }
        }
      };

      const isFinished = cards.length > 0 && matchedCardIds.length === cards.length / 2;

      return (
        <div>
          <div className="flex justify-between items-center mb-3">
            <span className="text-xs font-bold text-pink-500">같은 소리와 단어 짝을 찾으세요! (+10점)</span>
            <button type="button" onClick={startNewGame} className="text-xs font-bold text-slate-400 underline p-2">새로하기</button>
          </div>

          {isFinished ? (
            <div className="text-center py-10">
              <div className="text-6xl mb-2 bounce-gentle">🎉</div>
              <div className="font-black text-xl text-slate-700 mb-1">성공! 완벽해요!</div>
              <button type="button" onClick={startNewGame} className="bg-pink-400 text-white font-black px-6 py-3 rounded-2xl bubbly-btn mt-4 text-sm">
                한 판 더 하기 🚀
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-4 gap-2">
              {cards.map(card => {
                const isFlipped = flippedCards.some(c => c.id === card.id) || matchedCardIds.includes(card.pairId);
                const isMatched = matchedCardIds.includes(card.pairId);

                return (
                  <div
                    key={card.id}
                    onClick={() => handleCardClick(card)}
                    className={`h-24 rounded-2xl cursor-pointer flex flex-col items-center justify-center p-1 border-2 text-center transition-all ${
                      isMatched ? 'opacity-30 border-transparent bg-slate-100' : isFlipped ? 'bg-pink-100 border-pink-300 text-pink-700 font-extrabold shadow-inner' : 'bg-gradient-to-br from-amber-300 to-orange-400 border-white text-white font-black text-xl shadow-md'
                    }`}
                  >
                    {isFlipped ? (
                      <>
                        <div className="text-2xl">{card.type === 'word' ? card.emoji : '🔤'}</div>
                        <div className="text-xs font-black mt-1">{card.content}</div>
                      </>
                    ) : '⭐'}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function SpellingQuizMode({ unit, onScore }) {
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [userInput, setUserInput] = React.useState([]);
      const [scrambled, setScrambled] = React.useState([]);
      const [isCorrect, setIsCorrect] = React.useState(false);
      const currentWordObj = unit.words[currentIndex];

      React.useEffect(() => {
        if (!currentWordObj) return;
        setUserInput([]);
        setIsCorrect(false);
        const letters = currentWordObj.word.split('').sort(() => 0.5 - Math.random());
        setScrambled(letters.map((char, i) => ({ id: `${char}_${i}`, char, used: false })));
        speakText(currentWordObj.word);
      }, [currentIndex, unit]);

      const handleLetterClick = (item) => {
        if (isCorrect || item.used) return;
        setScrambled(prev => prev.map(l => l.id === item.id ? { ...l, used: true } : l));
        const newInput = [...userInput, item];
        setUserInput(newInput);
        speakText(item.char);

        if (newInput.length === currentWordObj.word.length) {
          if (newInput.map(i => i.char).join('') === currentWordObj.word) {
            setIsCorrect(true);
            speakText(currentWordObj.word);
            triggerConfetti();
            onScore(10);
          } else {
            setTimeout(() => {
              setUserInput([]);
              setScrambled(prev => prev.map(l => ({ ...l, used: false })));
            }, 700);
          }
        }
      };

      return (
        <div className="text-center">
          <div className="text-xs font-bold text-emerald-600 mb-2">알파벳 블록을 순서대로 눌러 단어를 완성하세요 (+10점)</div>
          <div className="text-6xl mb-1 bounce-gentle">{currentWordObj.emoji}</div>
          <div className="text-xs font-bold text-slate-400 mb-4">"{currentWordObj.kor}"</div>

          <div className="flex justify-center flex-wrap gap-1.5 mb-6">
            {Array.from({ length: currentWordObj.word.length }).map((_, idx) => {
              const item = userInput[idx];
              return (
                <div key={idx} className={`w-10 h-12 rounded-2xl border-2 font-black text-xl flex items-center justify-center ${
                  item ? (isCorrect ? 'bg-emerald-400 border-emerald-500 text-white' : 'bg-white border-emerald-300 text-slate-700') : 'bg-emerald-50 border-dashed border-emerald-200'
                }`}>
                  {item ? item.char : ''}
                </div>
              );
            })}
          </div>

          <div className="flex justify-center flex-wrap gap-2 mb-6">
            {scrambled.map(item => (
              <button
                key={item.id} type="button" disabled={item.used || isCorrect} onClick={() => handleLetterClick(item)}
                className={`w-11 h-12 rounded-2xl font-black text-lg border-2 bubbly-btn ${
                  item.used ? 'bg-slate-100 border-slate-200 text-slate-300' : 'bg-yellow-300 border-yellow-400 text-slate-800'
                }`}
              >
                {item.char}
              </button>
            ))}
          </div>

          {isCorrect && (
            <button type="button" onClick={() => setCurrentIndex(prev => (prev + 1) % unit.words.length)} className="bg-emerald-400 text-white font-extrabold px-6 py-3 rounded-2xl bubbly-btn text-sm">
              다음 문제 ➡️
            </button>
          )}
        </div>
      );
    }

    function MissingLetterMode({ unit, onScore }) {
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [options, setOptions] = React.useState([]);
      const [isCorrect, setIsCorrect] = React.useState(false);
      const currentWordObj = unit.words[currentIndex];

      React.useEffect(() => {
        if (!currentWordObj) return;
        setIsCorrect(false);
        const correct = currentWordObj.blend;
        const distractors = unit.targets.filter(t => t !== correct).sort(() => 0.5 - Math.random()).slice(0, 3);
        setOptions([correct, ...distractors].sort(() => 0.5 - Math.random()));
        speakText(currentWordObj.word);
      }, [currentIndex, unit]);

      const handleSelect = (opt) => {
        if (isCorrect) return;
        if (opt === currentWordObj.blend) {
          setIsCorrect(true);
          speakText(currentWordObj.word);
          triggerConfetti();
          onScore(10);
        } else {
          speakText(opt, 0.85, true); 
        }
      };

      return (
        <div className="text-center">
          <div className="text-xs font-bold text-sky-600 mb-2">빈칸에 들어갈 알맞은 소리를 고르세요 (+10점)</div>
          <div className="text-6xl mb-1 bounce-gentle">{currentWordObj.emoji}</div>
          <div className="text-xs font-bold text-slate-400 mb-4">"{currentWordObj.kor}"</div>

          <div className="text-3xl font-black mb-6 flex items-center justify-center gap-1.5">
            {currentWordObj.isSuffix ? (
              <>
                <span>{currentWordObj.rest}</span>
                <span className={`px-3 py-1 rounded-2xl border-2 inline-block ${isCorrect ? 'bg-sky-400 border-sky-500 text-white' : 'bg-sky-50 border-dashed border-sky-300 text-sky-400'}`}>
                  {isCorrect ? currentWordObj.blend : '___'}
                </span>
              </>
            ) : (
              <>
                <span className={`px-3 py-1 rounded-2xl border-2 inline-block ${isCorrect ? 'bg-sky-400 border-sky-500 text-white' : 'bg-sky-50 border-dashed border-sky-300 text-sky-400'}`}>
                  {isCorrect ? currentWordObj.blend : '___'}
                </span>
                <span>{currentWordObj.rest}</span>
              </>
            )}
          </div>

          <div className="grid grid-cols-2 gap-2.5 mb-6">
            {options.map((opt, i) => (
              <button
                key={i} type="button" onClick={() => handleSelect(opt)}
                className={`py-4 rounded-2xl font-black text-2xl border-2 bubbly-btn transition-all ${
                  isCorrect && opt === currentWordObj.blend ? 'bg-emerald-400 border-emerald-500 text-white' : 'bg-white border-sky-200 text-sky-600 hover:bg-sky-50'
                }`}
              >
                {opt}
              </button>
            ))}
          </div>

          {isCorrect && (
            <button type="button" onClick={() => setCurrentIndex(prev => (prev + 1) % unit.words.length)} className="bg-sky-400 text-white font-extrabold px-6 py-3 rounded-2xl bubbly-btn text-sm">
              다음 문제 ➡️
            </button>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
